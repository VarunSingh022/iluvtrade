name: CI

# Every gate this project has, run on a machine that is not a developer's.
#
# ---------------------------------------------------------------------------
# WHERE THE ENGINE COMES FROM
# ---------------------------------------------------------------------------
#
# AlphaLab is not on PyPI. backend/pyproject.toml depends on the v4.1.0 release
# wheel by direct reference, with the SHA-256 the release's SHA256SUMS-4.1.0
# records, so the ordinary `pip install -e ".[dev]"` below downloads exactly
# that artifact from the AlphaLab GitHub release and pip refuses it if a single
# byte differs. There is no other source: no repository variable, no wheel
# directory, nothing to configure, and nothing that can install a different
# engine quietly. If the download fails or the digest differs, the install step
# fails and every backend check after it is skipped by the failure itself.
#
# `scripts/verify-alphalab.sh` then checks what was installed — `pip check`, the
# version, that it loads from the venv's site-packages — and runs the release's
# own consumer contract (AlphaLab docs/INTEGRATION.md, checklist step 2) from a
# scratch directory outside the checkout.
#
# ---------------------------------------------------------------------------
# WHAT CI MUST NEVER TOUCH
# ---------------------------------------------------------------------------
#
# No developer paths, no real database, no broker, no payment provider. The
# test suite creates its own temporary database per test and refuses to open
# the developer's (tests/conftest.py); the only environment variables set here
# are a throwaway secret key and `test`, which is also what the suite defaults
# to. There are no secrets in this file and none are needed.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # A throwaway value. Not a secret, and deliberately not one: a real key in a
  # workflow file is a leaked key.
  ILUVTRADE_SECRET_KEY: ci-secret-key-not-for-production-0000000000
  ILUVTRADE_ENVIRONMENT: test
  # Explicitly off. CI must never reach a venue or a payment provider.
  ILUVTRADE_LIVE_TRADING_ENABLED: "false"
  ILUVTRADE_PAYMENT_PROVIDER: manual
  ILUVTRADE_FETCH_ALLOW_LOOPBACK: "false"

jobs:
  frontend:
    name: Frontend — typecheck, tests, production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Production build
        run: npm run build

  dependency-advisories:
    name: Dependency advisories vs the assessed set
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Fail on an advisory nobody has assessed
        run: ./scripts/audit-dependencies.sh

  backend:
    name: Backend — lint, types, tests, migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Create project venv and install dependencies
        working-directory: backend
        # The AlphaLab wheel arrives here, from the hash-pinned reference in
        # pyproject.toml; see "Where the engine comes from" above.
        run: |
          python -m venv .venv
          ./.venv/bin/pip install --upgrade pip
          ./.venv/bin/pip install -e ".[dev]"

      - name: AlphaLab — verify the installed release and run its consumer contract
        working-directory: backend
        run: ../scripts/verify-alphalab.sh "$PWD/.venv/bin/python"

      - name: Ruff
        working-directory: backend
        run: ./.venv/bin/ruff check .

      - name: Ruff format
        working-directory: backend
        run: ./.venv/bin/ruff format --check .

      - name: Mypy
        working-directory: backend
        run: ./.venv/bin/mypy

      - name: Configuration is safe for this environment
        working-directory: backend
        run: ./.venv/bin/python -m iluvtrade.cli check-config

      - name: AlphaLab boundary
        working-directory: backend
        run: ./.venv/bin/pytest -q tests/unit/test_engine_boundary.py

      - name: Test isolation — the suite cannot reach a real database
        working-directory: backend
        run: ./.venv/bin/pytest -q tests/test_isolation.py

      - name: Application suite (SQLite)
        working-directory: backend
        # SQLite, a temporary file per test. Tests marked postgres are listed as
        # not run here; the postgres job runs them.
        run: ./.venv/bin/pytest -q

      - name: Alembic — models match migrations
        working-directory: backend
        # Against a scratch database in the runner's workspace, never a
        # committed one. The path is relative so nothing here depends on a
        # particular machine's layout.
        run: |
          export ILUVTRADE_DATABASE_URL="sqlite:///${RUNNER_TEMP}/ci-check.db"
          ./.venv/bin/alembic upgrade head
          ./.venv/bin/alembic check

      - name: End-to-end demonstration
        working-directory: backend
        run: ./.venv/bin/python -m iluvtrade.cli demo

  postgres:
    name: PostgreSQL — migrations, PostgreSQL-specific tests, application suite
    runs-on: ubuntu-latest
    # Until 2026-10-11 the step that claimed to "run the suite against
    # PostgreSQL" ran it on SQLite: tests/conftest.py's autouse fixture replaced
    # ILUVTRADE_DATABASE_URL with a temporary SQLite file for every test. Only the
    # alembic step ever reached PostgreSQL. The suite now selects its backend from
    # ILUVTRADE_TEST_DATABASE_URL, gives each test its own PostgreSQL database
    # cloned from a template `alembic upgrade head` built, asserts on every test
    # that the engine really is PostgreSQL, and refuses -- rather than skips -- the
    # PostgreSQL tests when that variable is missing.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: iluvtrade
          POSTGRES_USER: iluvtrade
          POSTGRES_PASSWORD: ci-not-a-secret
        options: >-
          --health-cmd "pg_isready -U iluvtrade"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    env:
      # The server, not one database: the suite creates and drops its own
      # (prefixed iluvtrade_test_) through the maintenance database.
      ILUVTRADE_TEST_DATABASE_URL: postgresql+psycopg://iluvtrade:ci-not-a-secret@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Create project venv and install dependencies, with the PostgreSQL driver
        working-directory: backend
        run: |
          python -m venv .venv
          ./.venv/bin/pip install --upgrade pip
          ./.venv/bin/pip install -e ".[dev,postgres]"

      - name: PostgreSQL is up and answering
        run: pg_isready -h localhost -p 5432 -U iluvtrade

      - name: Migrations — empty to head, then drift check
        working-directory: backend
        env:
          ILUVTRADE_DATABASE_URL: postgresql+psycopg://iluvtrade:ci-not-a-secret@localhost:5432/iluvtrade
        run: |
          ./.venv/bin/alembic upgrade head
          ./.venv/bin/alembic current
          ./.venv/bin/alembic check

      - name: PostgreSQL-specific tests (tests/postgres)
        working-directory: backend
        run: ./.venv/bin/pytest -q -p no:cacheprovider tests/postgres

      - name: Application suite against PostgreSQL
        working-directory: backend
        # Prints "database backend: postgresql ..." in its header and lists any
        # sqlite_only test it did not run.
        run: ./.venv/bin/pytest -q -p no:cacheprovider -m "not postgres"
