[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "iluvtrade"
version = "0.1.0"
description = "iluvtrade.com — the application platform around AlphaLab, with the RedDesk strategy marketplace."
# No `readme` key. It used to be "../README.md", which hatchling refuses:
# "Readme path must be within the project directory". That made
# `pip install -e .` fail outright — so the package had never actually been
# installed, and everything worked only because pytest puts the working
# directory on sys.path and every command was run from `backend/`. The Docker
# build's `pip install ./backend` would have failed the same way.
#
# The alternative is a second README inside backend/ duplicating the root one.
# This package is proprietary and is not published to an index, so the long
# description earns nothing; the root README is where the documentation lives.
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Varun Kumar Singh" }]

dependencies = [
  # The engine, by direct reference to the published v4.1.0 release asset, with
  # the SHA-256 that release's SHA256SUMS-4.1.0 records. Never a bare
  # `alphalab==4.1.0`: AlphaLab is not on PyPI, and a bare name resolved against
  # a public index installs whoever registers it (AlphaLab docs/INTEGRATION.md).
  # pip refuses the download if its digest differs, so this one line is the pin
  # and the integrity check for every install path — development, CI and the
  # Docker image all install the package through it. To upgrade, replace both
  # the URL and the hash from the new release's SHA256SUMS file; never type a
  # hash by hand.
  "alphalab @ https://github.com/VarunSingh022/AlphaLab/releases/download/v4.1.0/alphalab-4.1.0-py3-none-any.whl#sha256=c2c1e8ca916a025b47350b15da9bde6fb3c64e626f2b05736e4152896b7a0a09",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  # The 2.0 series, which this code's typing is written for. `>=2.0,<3` let a
  # fresh resolve pick 2.1, where `Select` became variadic: the 2.0 spelling
  # `Select[tuple[T]]` in `platform.tenancy.scoped` then means "one column of type
  # tuple[T]", and mypy reports 97 errors downstream of it. The 524 tests pass on
  # 2.1.4, so it is a typing difference, not a runtime one. Moving to 2.1 is
  # `Select[tuple[T]]` -> `Select[T]` in `scoped` (mypy is clean on 2.1.4 with
  # that one change) together with raising this floor to 2.1 — no spelling is
  # correct under both.
  "sqlalchemy>=2.0.52,<2.1",
  "alembic>=1.14,<2",
  # The [email] extra, not bare pydantic. `EmailStr` raises ImportError without
  # `email-validator`, so a fresh install per the documented instructions
  # produced an application whose registration, login, invitation and
  # password-reset endpoints all failed — every route with an email field. It
  # happened to be present in the development environment, which is why nothing
  # noticed until the package was installed into a clean one.
  "pydantic[email]>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "python-multipart>=0.0.12",
  "argon2-cffi>=23.1,<26",
  "cryptography>=43,<46",
  "pyotp>=2.9,<3",
  # The pinned DNS transport uses HTTPcore's public backend/pool APIs. Keep
  # this pair at the versions exercised by the SSRF regression tests and CI.
  "httpx==0.28.1",
  "httpcore==1.0.9",
]

[project.optional-dependencies]
# The driver for the production database target. Not a hard dependency: a
# SQLite deployment does not need it, and a package that refuses to install
# without a PostgreSQL client library is a worse default for a laptop. But it
# has to be installable from this file — the Dockerfile installed it and
# pyproject did not, which made "pip install -e . && point at PostgreSQL" fail
# with ModuleNotFoundError rather than with anything about the database.
postgres = ["psycopg[binary]>=3.2,<4"]
dev = [
  "pytest>=8.4,<10",
  "pytest-cov>=6.0,<8",
  "mypy>=1.13,<2",
  "ruff>=0.8,<1",
  # No "types-requests": nothing imports `requests`, it was never installed,
  # and mypy is clean without it. A declared dependency that is absent from
  # every environment is one nobody would notice breaking.
]

[project.scripts]
iluvtrade = "iluvtrade.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["iluvtrade"]

[tool.hatch.metadata]
# Required for the AlphaLab dependency above, which is a URL rather than an
# index name. Hatchling refuses direct references unless this is set.
allow-direct-references = true

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "migrations/versions"]

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "RUF", "SIM", "UP"]
ignore = ["B008"]  # FastAPI Depends() in defaults is the framework idiom.

[tool.ruff.format]
line-ending = "lf"
quote-style = "double"

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
show_error_codes = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
files = ["iluvtrade"]
plugins = []

[[tool.mypy.overrides]]
module = ["alphalab.*"]
follow_imports = "silent"

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "-ra"]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
  "integration: exercises the real AlphaLab engine or the real database",
  "security: asserts a security or tenant-isolation invariant",
]
