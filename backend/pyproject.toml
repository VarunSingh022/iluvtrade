[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "iluvtrade"
version = "0.1.0"
description = "iluvtrade.com — the application platform around AlphaLab, with the RedDesk strategy marketplace."
# No `readme` key. It used to be "../README.md", which hatchling refuses:
# "Readme path must be within the project directory". That made
# `pip install -e .` fail outright — so the package had never actually been
# installed, and everything worked only because pytest puts the working
# directory on sys.path and every command was run from `backend/`. The Docker
# build's `pip install ./backend` would have failed the same way.
#
# The alternative is a second README inside backend/ duplicating the root one.
# This package is proprietary and is not published to an index, so the long
# description earns nothing; the root README is where the documentation lives.
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Varun Kumar Singh" }]

dependencies = [
  "alphalab==3.0.0",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2",
  # The [email] extra, not bare pydantic. `EmailStr` raises ImportError without
  # `email-validator`, so a fresh install per the documented instructions
  # produced an application whose registration, login, invitation and
  # password-reset endpoints all failed — every route with an email field. It
  # happened to be present in the development environment, which is why nothing
  # noticed until the package was installed into a clean one.
  "pydantic[email]>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "python-multipart>=0.0.12",
  "argon2-cffi>=23.1,<26",
  "cryptography>=43,<46",
  "pyotp>=2.9,<3",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
# The driver for the production database target. Not a hard dependency: a
# SQLite deployment does not need it, and a package that refuses to install
# without a PostgreSQL client library is a worse default for a laptop. But it
# has to be installable from this file — the Dockerfile installed it and
# pyproject did not, which made "pip install -e . && point at PostgreSQL" fail
# with ModuleNotFoundError rather than with anything about the database.
postgres = ["psycopg[binary]>=3.2,<4"]
dev = [
  "pytest>=8.4,<10",
  "pytest-cov>=6.0,<8",
  "mypy>=1.13,<2",
  "ruff>=0.8,<1",
  # No "types-requests": nothing imports `requests`, it was never installed,
  # and mypy is clean without it. A declared dependency that is absent from
  # every environment is one nobody would notice breaking.
]

[project.scripts]
iluvtrade = "iluvtrade.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["iluvtrade"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "migrations/versions"]

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "RUF", "SIM", "UP"]
ignore = ["B008"]  # FastAPI Depends() in defaults is the framework idiom.

[tool.ruff.format]
line-ending = "lf"
quote-style = "double"

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
show_error_codes = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
files = ["iluvtrade"]
plugins = []

[[tool.mypy.overrides]]
module = ["alphalab.*"]
follow_imports = "silent"

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "-ra"]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
  "integration: exercises the real AlphaLab engine or the real database",
  "security: asserts a security or tenant-isolation invariant",
]
